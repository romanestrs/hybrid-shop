# Optional helper: runs both databases LOCALLY (no cloud service involved).
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: hybrid_shop }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  mongo:
    image: mongo:7
    ports: ["27018:27017"]
    volumes: [mongodata:/data/db]
volumes: { pgdata: {}, mongodata: {} }
